<div>
  <label *ngIf="label" for="inputText">{{ label }}</label>
  <input
    type="text"
    id="inputText"
    [ngClass]="[size]"
    [placeholder]="placeholderText"
    [(ngModel)]="input"
    (focus)="onTouch()"
    (ngModelChange)="onChange($event)"
    [type]="type"
  />
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
</div>
